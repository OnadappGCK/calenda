<section class="container">
  <h1>Contact</h1>

  @if (ok()) {
    <div class="ok">Message envoyé avec succès !</div>
  }

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form class="form" (ngSubmit)="submit()">
    <label class="field">
      Email
      <input type="email" name="email" [(ngModel)]="email" required />
    </label>

    <label class="field">
      Sujet
      <input type="text" name="sujet" [(ngModel)]="sujet" required />
    </label>

    <label class="field">
      Message
      <textarea rows="6" name="message" [(ngModel)]="message" required></textarea>
    </label>

    <button class="btn btnPrimary" type="submit" [disabled]="loading() || cooldown() > 0">
      @if (loading()) {
        Envoi en cours...
      } @else if (cooldown() > 0) {
        Patienter {{ cooldown() }}s
      } @else {
        Envoyer
      }
    </button>
  </form>
</section>
