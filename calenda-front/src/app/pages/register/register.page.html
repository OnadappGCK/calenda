<section class="wrap">
  <h1>Inscription</h1>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <div class="avatarRow">
    <div class="avatarPreview">
      <img [src]="profileImageUrl(profileImage)" alt="" />
    </div>
    <button class="btn" type="button" (click)="openAvatarPicker()">Choisir une photo</button>
  </div>

  <form (ngSubmit)="submit()">
    <label>
      Pseudo
      <input name="pseudo" type="text" [(ngModel)]="pseudo" required />
    </label>

    <label>
      Email
      <input name="email" type="email" [(ngModel)]="email" required />
    </label>

    <label>
      Adresse
      <input
        type="text"
        [ngModel]="adresse"
        (ngModelChange)="onAdresseInput($event)"
        name="adresse"
        (focus)="adresseSuggestOpen.set(true)"
        required
      />
    </label>

    @if (adresseSuggestOpen() && adresseSuggestions().length > 0) {
      <div class="suggest">
        @for (f of adresseSuggestions(); track $index) {
          <button class="suggestItem" type="button" (click)="chooseAdresseSuggestion(f)">
            {{ adresseSuggestionLabel(f) }}
          </button>
        }
      </div>
    }

    <label>
      Téléphone
      <input name="numero" type="tel" [(ngModel)]="numero" />
    </label>

    <label>
      Mot de passe
      <input name="password" type="password" [(ngModel)]="password" required />
    </label>

    <label>
      Confirmation
      <input
        name="passwordConfirmation"
        type="password"
        [(ngModel)]="passwordConfirmation"
        required
      />
    </label>

    <div id="registerTurnstile"></div>

    <button class="btn" type="submit" [disabled]="submitting()">Créer mon compte</button>
  </form>

  <p class="hint">
    Déjà un compte ?
    <a routerLink="/login">Connexion</a>
  </p>
</section>

@if (showAvatarPicker()) {
  <div class="modalBackdrop" (click)="closeAvatarPicker()"></div>
  <div class="modal" (click)="$event.stopPropagation()">
    <h2>Choisir une photo</h2>
    <div class="avatarGrid">
      @for (img of allowedAvatars; track img) {
        <button class="avatarChoice" type="button" (click)="selectAvatar(img)">
          <img [src]="profileImageUrl(img)" alt="" />
        </button>
      }
    </div>
    <div class="actions">
      <button class="btn" type="button" (click)="closeAvatarPicker()">Fermer</button>
    </div>
  </div>
}
